services:
  database:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kampung_quest}
      POSTGRES_USER: ${POSTGRES_USER:-kampung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kampung_dev_password}
    volumes:
      - kampung-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kampung} -d ${POSTGRES_DB:-kampung_quest}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kampung}:${POSTGRES_PASSWORD:-kampung_dev_password}@database:5432/${POSTGRES_DB:-kampung_quest}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MEMORY_MODEL: ${OPENAI_MEMORY_MODEL:-gpt-5.6-luna}
      OPENAI_SYNTHESIS_MODEL: ${OPENAI_SYNTHESIS_MODEL:-gpt-5.6-terra}
      OPENAI_SAFETY_MODEL: ${OPENAI_SAFETY_MODEL:-gpt-5.6-terra}
      OPENAI_RECOVERY_MODEL: ${OPENAI_RECOVERY_MODEL:-gpt-5.6-terra}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      APP_MAX_CANDIDATES: ${APP_MAX_CANDIDATES:-15}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kampung-data:
