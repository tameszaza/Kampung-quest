services:
  database:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kampung_quest}
      POSTGRES_USER: ${POSTGRES_USER:-kampung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kampung_dev_password}
    volumes:
      - kampung-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kampung} -d ${POSTGRES_DB:-kampung_quest}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kampung}:${POSTGRES_PASSWORD:-kampung_dev_password}@database:5432/${POSTGRES_DB:-kampung_quest}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-secret-change-before-production-1234}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AVATAR_STORAGE_DIR: /app/.data/avatars
      AGENT_PROVIDER: ${AGENT_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MEMORY_MODEL: ${OPENAI_MEMORY_MODEL:-gpt-5.6-luna}
      OPENAI_SYNTHESIS_MODEL: ${OPENAI_SYNTHESIS_MODEL:-gpt-5.6-terra}
      OPENAI_SAFETY_MODEL: ${OPENAI_SAFETY_MODEL:-gpt-5.6-terra}
      OPENAI_RECOVERY_MODEL: ${OPENAI_RECOVERY_MODEL:-gpt-5.6-terra}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_MEMORY_MODEL: ${GEMINI_MEMORY_MODEL:-gemini-2.5-flash-lite}
      GEMINI_SYNTHESIS_MODEL: ${GEMINI_SYNTHESIS_MODEL:-gemini-2.5-flash}
      GEMINI_SAFETY_MODEL: ${GEMINI_SAFETY_MODEL:-gemini-2.5-flash-lite}
      GEMINI_RECOVERY_MODEL: ${GEMINI_RECOVERY_MODEL:-gemini-2.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      APP_MAX_CANDIDATES: ${APP_MAX_CANDIDATES:-15}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - kampung-uploads:/app/.data

volumes:
  kampung-data:
  kampung-uploads:
